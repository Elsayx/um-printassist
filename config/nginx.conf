server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;

    # A PDF.js module worker must receive a JavaScript MIME type, including
    # on Nginx distributions whose default mime.types omits .mjs.
    location ~* \.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
    }

    # An absent resource must be an actual 404. Only application routes
    # should get the SPA shell.
    location ~ ^/(assets|samples|pdfjs-assets)/ {
        try_files $uri =404;
    }
    location ~ /[^/]*\.[^/]+$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
