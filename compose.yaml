services:
  printassist:
    build:
      context: .
      args:
        VITE_PRINTER_STATUS_URL: "${VITE_PRINTER_STATUS_URL:-}"
    ports:
      - "${PRINTASSIST_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
